<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비키니시티 포즈 측정소</title>
    <style>
        /* 비키니시티 바닷속 테마 배경 */
        body {
            background: linear-gradient(180deg, #1aa3ff 0%, #0044cc 100%);
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 스폰지밥 스타일의 아기자기한 제목 */
        h1 {
            color: #fffb00;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #ff6600, 6px 6px 0px #000;
            letter-spacing: 2px;
        }

        /* 네모네모 스폰지밥 느낌의 시작 버튼 */
        button {
            background-color: #fffb00;
            color: #0044cc;
            border: 4px solid #ff6600;
            padding: 12px 40px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 0 #cc5200;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #ffe600;
            transform: translateY(2px);
            box-shadow: 0 6px 0 #cc5200;
        }

        button:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #cc5200;
        }

        /* 캔버스 영역 - 바다 밑 모래사장 느낌의 테두리 */
        #canvas-container {
            margin: 20px auto;
            border: 8px solid #ffcc66;
            border-radius: 20px;
            width: fit-content;
            background-color: #001133;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            line-height: 0; 
            overflow: hidden;
        }

        /* 결과창 */
        #label-container {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fffb00;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        #label-container div {
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
        }

        /* 집게리아 메뉴판 느낌의 도움말 상자 */
        #help-box {
            margin: 30px auto;
            padding: 20px;
            max-width: 500px;
            background-color: #fff8e7;
            border: 6px dashed #ff6600;
            border-radius: 15px;
            text-align: left;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #help-title {
            font-size: 1.8rem;
            color: #d11a2a;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 3px solid #ff6600;
            padding-bottom: 5px;
        }

        #help-text {
            font-size: 1.4rem;
            color: #333333;
            line-height: 1.6;
            font-weight: bold;
            text-align: center;
        }

        /* ----------------------------------------------------
           캐릭터 및 말풍선 레이아웃
        ---------------------------------------------------- */
        .character-wrap {
            position: fixed;
            top: 30%;
            z-index: 10;
        }

        /* 207px에서 20%를 더 키운 248px로 설정 */
        #spongebob-wrap {
            width: 248px; 
            left: 4%;
            animation: floatSpongebob 3s ease-in-out infinite;
        }

        /* 뚱이는 기존 크기(180px) 유지 */
        #patrick-wrap {
            width: 180px;
            right: 4%;
            animation: floatPatrick 3.5s ease-in-out infinite;
        }

        .character-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 말풍선 기본 공통 스타일 */
        .bubble {
            position: absolute;
            background: #ffffff;
            color: #222222;
            font-family: 'Malgun Gothic', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 16px;
            border-radius: 20px;
            border: 3px solid #333333;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            width: 160px;
            text-align: center;
            word-break: keep-all;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none;
        }

        /* 말풍선 꼬리표 디자인 */
        .bubble::after {
            content: '';
            position: absolute;
            border-style: solid;
            display: block;
            width: 0;
        }

        /* 스폰지밥 말풍선 (스폰지밥이 커졌으므로 겹치지 않게 우측(left) 마진을 150px로 조정) */
        #spongebob-bubble {
            top: -70px;
            left: 150px;
        }
        #spongebob-bubble::after {
            top: 60px;
            left: 30px;
            border-width: 15px 15px 0 0;
            border-color: #ffffff transparent transparent transparent;
        }
        #spongebob-bubble::before {
            content: '';
            position: absolute;
            top: 60px;
            left: 28px;
            border-style: solid;
            border-width: 18px 18px 0 0;
            border-color: #333333 transparent transparent transparent;
            display: block;
            width: 0;
        }

        /* 뚱이 말풍선 */
        #patrick-bubble {
            top: -70px;
            right: 100px;
        }
        #patrick-bubble::after {
            top: 60px;
            right: 30px;
            border-width: 15px 0 0 15px;
            border-color: #ffffff transparent transparent transparent;
        }
        #patrick-bubble::before {
            content: '';
            position: absolute;
            top: 60px;
            right: 28px;
            border-style: solid;
            border-width: 18px 0 0 18px;
            border-color: #333333 transparent transparent transparent;
            display: block;
            width: 0;
        }

        /* 말풍선 활성화 */
        .bubble.show {
            opacity: 1;
        }

        /* 둥실둥실 애니메이션 */
        @keyframes floatSpongebob {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes floatPatrick {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(-4deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @media (max-width: 1250px) {
            .character-wrap {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="spongebob-wrap" class="character-wrap">
        <div id="spongebob-bubble" class="bubble">난 준비됐어!</div>
        <img class="character-img" src="스폰지밥.png" alt="스폰지밥">
    </div>

    <div id="patrick-wrap" class="character-wrap">
        <div id="patrick-bubble" class="bubble">안녕? 난 뚱이야!</div>
        <img class="character-img" src="뚱이.png" alt="뚱이">
    </div>

    <h1>Bikini Bottom Pose Center</h1>
    <button type="button" onclick="init()">출근하기! (시작)</button>
    
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="label-container"></div>

    <div id="help-box">
        <div id="help-title">징징이의 잔소리 (도움말)</div>
        <div id="help-text">시작 버튼을 누르고 카메라를 똑바로 쳐다보라구!</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/KS4rMAlrWP/";
        let model, webcam, ctx, labelContainer, maxPredictions;
        let helpTitle, helpText;

        const POSE_GUIDE = {
            "Class 1": {
                title: "월요일 좋아 자세! (바른 자세)",
                text: "스폰지밥처럼 활기차고 곧은 자세야! 아주 좋아!"
            },
            "Class 2": {
                title: "해파리 사냥 금지 (거북목 주의)",
                text: "목이 플랑크톤처럼 앞으로 나와있어! 어깨를 펴고 턱을 당겨!"
            },
            "Class 3": {
                title: "뚱이처럼 삐딱함 (몸 기울어짐)",
                text: "몸이 한쪽으로 쏠렸어! 양쪽 골반과 어깨 수평을 맞춰줘!"
            }
        };

        // 캐릭터 대사 목록
        const spongebobQuotes = [
            "월요일 좋아~ 최고로 좋아~!",
            "오늘도 좋은 하루야, 친구!",
            "집게리아 버거 먹고 싶다!",
            "거기 너, 자세가 아주 멋진걸?",
            "헤헤헤헤헿! 난 준비됐어!",
            "징징아! 같이 해파리 잡으러 가자!"
        ];

        const patrickQuotes = [
            "그게 무슨 소리야, 스폰지밥?",
            "지식은 우정을 대신할 수 없어.",
            "나 배고파... 내 사랑 게살버거...",
            "음... 생각하는 건 너무 어려워.",
            "내 이름은 '뚱이'가 아니라 '천재'라구!",
            "다리가 저릴 땐 누워있는 게 최고야."
        ];

        function startTalking() {
            const spongebobBubble = document.getElementById("spongebob-bubble");
            const patrickBubble = document.getElementById("patrick-bubble");

            spongebobBubble.classList.add("show");
            patrickBubble.classList.add("show");

            setInterval(() => {
                const randomSponge = spongebobQuotes[Math.floor(Math.random() * spongebobQuotes.length)];
                const randomPatrick = patrickQuotes[Math.floor(Math.random() * patrickQuotes.length)];

                spongebobBubble.classList.remove("show");
                patrickBubble.classList.remove("show");

                setTimeout(() => {
                    spongebobBubble.innerText = randomSponge;
                    patrickBubble.innerText = randomPatrick;
                    spongebobBubble.classList.add("show");
                    patrickBubble.classList.add("show");
                }, 400);

            }, 5000);
        }

        window.onload = startTalking;

        // 티처블 머신 제어 코드
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmPose.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const width = 480;
            const height = 270;
            const flip = true; 
            
            webcam = new tmPose.Webcam(width, height, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            const canvas = document.getElementById("canvas");
            canvas.width = width; 
            canvas.height = height;
            ctx = canvas.getContext("2d");
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; 
            for (let i = 0; i < maxPredictions; i++) { 
                labelContainer.appendChild(document.createElement("div"));
            }

            helpTitle = document.getElementById("help-title");
            helpText = document.getElementById("help-text");
        }

        async function loop(timestamp) {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let highestClass = "";
            let highestProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                
                labelContainer.childNodes[i].innerHTML = 
                    `${className}: ${(probability * 100).toFixed(0)}%`;

                if (probability > highestProb) {
                    highestProb = probability;
                    highestClass = className;
                }
            }

            if (highestProb > 0.70 && POSE_GUIDE[highestClass]) {
                helpTitle.innerText = POSE_GUIDE[highestClass].title;
                helpText.innerText = POSE_GUIDE[highestClass].text;
            }

            drawPose(pose);
        }

        function drawPose(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }
    </script>
</body>
</html>
