<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비키니 시티 판별소</title>
    <style>
        /* 기본 비키니 시티 수중 배경 */
        body {
            background: linear-gradient(180deg, #1fa2ff 0%, #12d6df 50%, #a6ffcb 100%);
            color: #fff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Nanum Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; 
            position: relative;
        }

        h1 {
            text-shadow: 3px 3px 0px #ed1b24, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 1px 1px 0px #000;
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            z-index: 10; 
        }

        /* --- 배경 보글보글 거품 --- */
        .bubble {
            position: absolute;
            bottom: -50px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp infinite linear;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) translateX(50px); opacity: 0; }
        }

        /* --- 둥둥 떠다니는 배경 캐릭터 및 말풍선 스타일 --- */
        .floating-char {
            position: absolute;
            width: 150px; 
            height: auto;
            animation: bobbing 4s infinite ease-in-out;
            z-index: 2; 
            opacity: 0.9;
        }

        /* 캐릭터 위치는 원래대로(원안 복구) */
        #spongebob { top: 15%; left: 10%; animation-delay: 0s; }
        #patrick { top: 60%; left: 5%; animation-delay: 1s; width: 180px; }
        #squidward { top: 30%; right: 8%; animation-delay: 2s; }

        @keyframes bobbing {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }

        /* 말풍선 디자인 및 글자 전환 애니메이션 */
        .dialogue-box {
            position: absolute;
            background: white;
            color: #333;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            max-width: 200px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .dialogue-box::after {
            content: '';
            position: absolute;
            border-style: solid;
            border-width: 10px;
            display: block;
            width: 0;
            z-index: 1;
        }

        /* 말풍선 위치만 캐릭터 쪽으로 가깝게 수정 */
        #sb-dialogue { top: 12%; left: 17%; }
        #sb-dialogue::after { border-color: transparent white transparent transparent; left: -20px; top: 15px; }

        #pat-dialogue { top: 58%; left: 14%; }
        #pat-dialogue::after { border-color: transparent white transparent transparent; left: -20px; top: 15px; }

        #sq-dialogue { top: 27%; right: 15%; }
        #sq-dialogue::after { border-color: transparent transparent transparent white; right: -20px; top: 15px; }

        .show-dialogue { opacity: 1; }

        /* --- 메인 판별기 UI 컨테이너 --- */
        .main-container {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.25);
            padding: 25px;
            border-radius: 25px;
            border: 5px dashed #fff94f;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 240px;
        }

        button {
            background-color: #fff94f;
            color: #333;
            border: 4px solid #e1b12c;
            border-radius: 20px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #e1b12c;
            transition: all 0.1s ease;
            margin-bottom: 20px;
            font-family: inherit;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        button:disabled {
            background-color: #ccc;
            border-color: #999;
            box-shadow: none;
            cursor: not-allowed;
        }

        #webcam-container {
            border: 6px solid #ff9f43;
            border-radius: 20px;
            overflow: hidden;
            width: 200px;
            height: 200px;
            background: #333;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        #label-container {
            margin-top: 20px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff94f;
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #000;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #fff;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result-image-container {
            border: 6px solid #10ac84;
            border-radius: 20px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        #result-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <img src="./a.png" id="spongebob" class="floating-char" alt="스폰지밥">
    <img src="./b.png" id="patrick" class="floating-char" alt="뚱이">
    <img src="./c.png" id="squidward" class="floating-char" alt="징징이">

    <div id="sb-dialogue" class="dialogue-box">월요일 좋아! 같이 사진 찍자!</div>
    <div id="pat-dialogue" class="dialogue-box">으아암... 이거 먹는 거야?</div>
    <div id="sq-dialogue" class="dialogue-box">조용히 좀 해, 이 바보들아...</div>

    <h1>비키니 시티 인물 판별소 🧽</h1>

    <div class="main-container">
        <div class="panel">
            <button type="button" id="action-btn" onclick="handleAction()">카메라 켜기</button>
            <div id="webcam-container"></div>
            <div id="label-container">준비 완료!</div>
        </div>

        <div class="panel">
            <div style="margin-bottom: 20px; font-weight: bold; font-size: 1.3rem; color: #fff94f; text-shadow: 1px 1px 2px #000;">가장 닮은 이웃</div>
            <div id="result-image-container">
                <span style="color: #666; font-size: 0.9rem;">사진을 찍어주세요</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/H3nEd0_Pv/";
        let model, webcam, labelContainer, maxPredictions;
        let isSetup = false;
        let isRunning = false; 
        let animationId;        
        let dialogueIntervals = []; 

        const koreanNames = ["네트", "워커", "톰", "프레드", "낸시", "헤럴드", "인어맨", "조개소년"];

        const sbDial = document.getElementById('sb-dialogue');
        const patDial = document.getElementById('pat-dialogue');
        const sqDial = document.getElementById('sq-dialogue');

        const sbIdleQuotes = ["월요일 좋아!", "난 준비됐어!", "집게리아로 오세요!", "따라라라라라~🎶", "나랑 닮은 이웃이 나오면 좋겠다!"];
        const patIdleQuotes = ["으아암...", "아무것도 안 하기가 내 전공이야.", "나랑 닮으면 맛있는 거 주나?", "내 배꼽 어디 갔지?", "단어란 참 어려워.."];
        const sqIdleQuotes = ["언제쯤 조용해질까...", "클라리넷 연습해야 해.", "나랑 닮은 정상적인 사람이어야 할 텐데.", "사장님, 월급 좀 올려줘.", "집에 가고 싶다.."];

        function initBackground() {
            for (let i = 0; i < 15; i++) {
                let bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.width = bubble.style.height = `${Math.random() * 40 + 10}px`;
                bubble.style.animationDuration = `${Math.random() * 5 + 4}s`;
                bubble.style.animationDelay = `${Math.random() * 3}s`;
                document.body.appendChild(bubble);
            }
            
            startIdleDialogues();
        }

        function startIdleDialogues() {
            stopIdleDialogues();

            changeDialogue(sbDial, sbIdleQuotes);
            changeDialogue(patDial, patIdleQuotes);
            changeDialogue(sqDial, sqIdleQuotes);

            dialogueIntervals.push(setInterval(() => changeDialogue(sbDial, sbIdleQuotes), 2500));
            dialogueIntervals.push(setInterval(() => changeDialogue(patDial, patIdleQuotes), 2500));
            dialogueIntervals.push(setInterval(() => changeDialogue(sqDial, sqIdleQuotes), 2500));
        }

        function stopIdleDialogues() {
            dialogueIntervals.forEach(interval => clearInterval(interval));
            dialogueIntervals = [];
        }

        function changeDialogue(el, quotes) {
            el.style.opacity = 0.3;
            
            setTimeout(() => {
                if (quotes.length > 0) { 
                    el.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                }
                el.style.opacity = 1;
                el.classList.add('show-dialogue');
            }, 250);
        }

        window.onload = initBackground;

        async function handleAction() {
            const btn = document.getElementById("action-btn");
            
            if (!isSetup) {
                btn.innerText = "로딩 중...";
                btn.disabled = true;
                await init();
                btn.innerText = "찰칵! 멈추기";
                btn.disabled = false;
                isSetup = true;
                isRunning = true;
                return;
            }

            if (isRunning) {
                cancelAnimationFrame(animationId);
                isRunning = false;
                stopIdleDialogues(); 
                await predict();
                btn.innerText = "다시 찍기";
            } else {
                animationId = window.requestAnimationFrame(loop);
                isRunning = true;
                btn.innerText = "찰칵! 멈추기";
                document.getElementById("label-container").innerText = "분석 중...";
                document.getElementById("result-image-container").innerHTML = '<span style="color: #666; font-size: 0.9rem;">사진을 찍어주세요</span>';
                
                startIdleDialogues();
            }
        }

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            const flip = true;
            webcam = new tmImage.Webcam(200, 200, flip);
            await webcam.setup();
            await webcam.play();
            animationId = window.requestAnimationFrame(loop);
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
        }

        async function loop() {
            webcam.update(); 
            animationId = window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let highestSuccessIndex = 0;
            let highestProbability = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProbability) {
                    highestProbability = prediction[i].probability;
                    highestSuccessIndex = i;
                }
            }

            const krName = koreanNames[highestSuccessIndex] || prediction[highestSuccessIndex].className;
            labelContainer.innerText = krName;

            const imgNumber = highestSuccessIndex + 1;
            if (imgNumber <= 8) {
                const imgContainer = document.getElementById("result-image-container");
                imgContainer.innerHTML = `<img src="./${imgNumber}.png" alt="${krName}">`;
            }

            let sbResultQuotes = [
                `와아! ${krName}구나! 나랑 안 닮아서 아주 살짝 아쉽지만 반가워!`,
                `하하하! ${krName}, 집게리아에서 게살버거 하나 먹고 갈래?`,
                `대박! 비키니 시티의 새로운 이웃 ${krName} 탄생!`
            ];
            
            let patResultQuotes = [
                `에이, 나랑 안 닮았잖아? 아쉽다... 근데 ${krName}는 맛있는 거야?`,
                `나랑 안 닮았다고? 그럼 내가 지금부터 ${krName} 할래!`,
                `안녕? 너가 그 유명한 ${krName}구나!`
            ];

            let sqResultQuotes = [
                `흥, 나처럼 고결하고 예술적인 면모는 역시 없군. 안 닮아서 다행이야.`,
                `나랑 안 닮아서 정말 다행이군. 저 녀석들과 엮이는 건 두 명으로 족해.`,
                `${krName}...? 또 이상한 이웃이 늘어난 기분인데... 조용히만 해줘.`
            ];

            sbDial.innerText = sbResultQuotes[Math.floor(Math.random() * sbResultQuotes.length)];
            patDial.innerText = patResultQuotes[Math.floor(Math.random() * patResultQuotes.length)];
            sqDial.innerText = sqResultQuotes[Math.floor(Math.random() * sqResultQuotes.length)];

            sbDial.style.opacity = 1;
            patDial.style.opacity = 1;
            sqDial.style.opacity = 1;
            sbDial.classList.add('show-dialogue');
            patDial.classList.add('show-dialogue');
            sqDial.classList.add('show-dialogue');
        }
    </script>
</body>
</html>
