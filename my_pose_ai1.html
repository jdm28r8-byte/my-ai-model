<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Teachable Machine Pose Model (16:9)</title>
    <style>
        /* 전체적인 디자인을 검은색과 붉은색 톤으로 설정 */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
        }

        /* 제목 스타일링 (더 크고 직관적이게) */
        h1 {
            color: #ff3333;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        /* 시작 버튼 (붉은색 포인트) */
        button {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #cc0000;
        }

        /* 캔버스 영역 - 16:9 비율 박스 레이아웃 유지 */
        #canvas-container {
            margin: 20px auto;
            border: 4px solid #ff3333;
            width: fit-content;
            background-color: #000;
            line-height: 0; /* 하단 미세한 공백 제거 */
        }

        /* 글씨 크기를 대폭 키운 결과창 */
        #label-container {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff9999;
            margin-top: 20px;
        }

        #label-container div {
            margin: 10px 0;
        }

        /* 포즈별 도움말을 보여줄 상자 */
        #help-box {
            margin: 30px auto;
            padding: 20px;
            max-width: 500px;
            background-color: #1e1e1e;
            border-left: 8px solid #ff3333;
            border-radius: 4px;
            text-align: left;
        }

        #help-title {
            font-size: 1.6rem;
            color: #ff3333;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #help-text {
            font-size: 1.3rem;
            color: #e0e0e0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Teachable Machine Pose Model</h1>
    <button type="button" onclick="init()">시작하기</button>
    
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="label-container"></div>

    <div id="help-box">
        <div id="help-title">포즈 도움말</div>
        <div id="help-text">시작 버튼을 누르고 카메라를 응시해주세요.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/KS4rMAlrWP/";
        let model, webcam, ctx, labelContainer, maxPredictions;
        let helpTitle, helpText;

        // [중요] 본인의 클래스명에 맞게 수정하여 사용하세요.
        const POSE_GUIDE = {
            "Class 1": {
                title: "바른 자세",
                text: "아주 좋습니다! 현재 허리를 곧게 펴고 바른 자세를 유지하고 있습니다."
            },
            "Class 2": {
                title: "거북목 주의",
                text: "목이 앞으로 많이 나와 있습니다. 어깨를 펴고 턱을 뒤로 당겨주세요!"
            },
            "Class 3": {
                title: "몸 기울어짐",
                text: "몸이 한쪽으로 쏠려 있습니다. 양쪽 골반과 어깨의 수평을 맞춰주세요."
            }
        };

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmPose.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // 16:9 비율 설정을 위한 변수 정의 (480 : 270)
            const width = 480;
            const height = 270;
            const flip = true; 
            
            // 캠 생성 시 너비와 높이를 각각 다르게 전달합니다.
            webcam = new tmPose.Webcam(width, height, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            const canvas = document.getElementById("canvas");
            canvas.width = width; 
            canvas.height = height;
            ctx = canvas.getContext("2d");
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; 
            for (let i = 0; i < maxPredictions; i++) { 
                labelContainer.appendChild(document.createElement("div"));
            }

            helpTitle = document.getElementById("help-title");
            helpText = document.getElementById("help-text");
        }

        async function loop(timestamp) {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let highestClass = "";
            let highestProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                
                labelContainer.childNodes[i].innerHTML = 
                    `${className}: ${(probability * 100).toFixed(0)}%`;

                if (probability > highestProb) {
                    highestProb = probability;
                    highestClass = className;
                }
            }

            if (highestProb > 0.70 && POSE_GUIDE[highestClass]) {
                helpTitle.innerText = POSE_GUIDE[highestClass].title;
                helpText.innerText = POSE_GUIDE[highestClass].text;
            }

            drawPose(pose);
        }

        function drawPose(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }
    </script>
</body>
</html>
